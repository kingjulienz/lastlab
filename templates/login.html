{% extends "base.html" %}
{% block content %}
<div class="flex justify-center items-center py-8">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl relative overflow-hidden">
        <!-- เอฟเฟกต์แสงไฟเรืองแสงด้านหลัง (Glow effect) -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-600/20 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-indigo-600/20 rounded-full blur-2xl"></div>

        <div class="text-center mb-8 relative z-10">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600/10 border border-blue-500/20 text-blue-400 rounded-2xl mb-3 shadow-inner">
                🔒
            </div>
            <h2 class="text-2xl font-bold text-white tracking-wide">เข้าสู่ระบบ</h2>
            <p class="text-xs text-slate-400 mt-1">Secure Personal Income & Expense Tracker</p>
        </div>

        <form method="POST" class="space-y-5 relative z-10">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Username</label>
                <div class="relative">
                    <input type="text" name="username" placeholder="กรอกชื่อผู้ใช้งาน" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <input type="password" name="password" placeholder="••••••••" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-blue-600/25 flex items-center justify-center space-x-2">
                <span>เข้าสู่ระบบ</span>
                <span>➔</span>
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400 relative z-10">
            ยังไม่มีบัญชีผู้ใช้? 
            <a href="{{ url_for('register') }}" class="text-blue-400 hover:text-blue-300 font-semibold underline underline-offset-4 ml-1">สมัครสมาชิกที่นี่</a>
        </div>
    </div>
</div>
{% endblock %}
