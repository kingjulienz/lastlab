{% extends "base.html" %}
{% block content %}
<div class="flex justify-center items-center py-6">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl relative overflow-hidden">
        <!-- Glow effect ด้านหลังการ์ด -->
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-emerald-600/20 rounded-full blur-2xl"></div>

        <!-- Header -->
        <div class="text-center mb-6 relative z-10">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-emerald-600/10 border border-emerald-500/20 text-emerald-400 rounded-2xl mb-3 shadow-inner">
                ✨
            </div>
            <h2 class="text-2xl font-bold text-white tracking-wide">สมัครสมาชิก</h2>
            <p class="text-xs text-slate-400 mt-1">สร้างบัญชีเพื่อเริ่มต้นจัดการการเงินอย่างปลอดภัย</p>
        </div>

        <!-- Register Form -->
        <form method="POST" class="space-y-4 relative z-10">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Username (ชื่อผู้ใช้)</label>
                <input type="text" name="username" placeholder="ตั้งชื่อผู้ใช้งาน" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password (รหัสผ่าน)</label>
                <input type="password" name="password" placeholder="ตั้งรหัสผ่าน" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">เบอร์โทรศัพท์ (สำหรับ PII Protection)</label>
                <input type="text" name="phone" placeholder="เช่น 0812345678" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">เลือกบทบาท (Role-Based Access Control)</label>
                <select name="role" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 transition">
                    <option value="user">User ทั่วไป</option>
                    <option value="admin">Admin (ผู้ดูแลระบบ)</option>
                </select>
            </div>

            <button type="submit" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-emerald-600/25 mt-2 flex items-center justify-center space-x-2">
                <span>ยืนยันการสมัครสมาชิก</span>
                <span>➔</span>
            </button>
        </form>

        <!-- Footer Link -->
        <div class="mt-6 text-center text-xs text-slate-400 relative z-10">
            มีบัญชีผู้ใช้อยู่แล้ว? 
            <a href="{{ url_for('login') }}" class="text-emerald-400 hover:text-emerald-300 font-semibold underline underline-offset-4 ml-1">เข้าสู่ระบบที่นี่</a>
        </div>
    </div>
</div>
{% endblock %}
